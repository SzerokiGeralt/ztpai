services:
  postgres:
    image: postgres
    container_name: postgres_db
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio_storage
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin adminadmin) do echo 'Czekam na MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/productphotos || true;
      /usr/bin/mc anonymous set public myminio/productphotos;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: